<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="script.js">
    <style>
        #sampleText {
            font-size: 16px;
            transition: font-size 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <h1>Font Size Changer</h1>
    <p id="sampleText">This is a sample text.</p>
    <button id="increaseFont">Increase Font Size</button>
    <button id="decreaseFont">Decrease Font Size</button>
    <button id="resetFont">Reset Font Size</button>


    <script>
        const sampleText = document.getElementById('sampleText');
        const increaseFontButton = document.getElementById('increaseFont');
        const decreaseFontButton = document.getElementById('decreaseFont');
        const resetFontButton = document.getElementById('resetFont');

        let currentFontSize = 16;

        increaseFontButton.addEventListener('click', () => {
            currentFontSize += 2;
            sampleText.style.fontSize = `${currentFontSize}px`;
        });

        decreaseFontButton.addEventListener('click', () => {
            currentFontSize -= 2;
            sampleText.style.fontSize = `${currentFontSize}px`;
        });

        resetFontButton.addEventListener('click', () => {
            currentFontSize = 16;
            sampleText.style.fontSize = `${currentFontSize}px`;
        });
    </script>
</body>
</html>
